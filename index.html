<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Buquê</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root{ --bg:#07050b; box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);}
  body{background:radial-gradient(ellipse at 50% 40%,rgba(170,100,255,.22) 0%,transparent 55%),
       radial-gradient(ellipse at 50% 45%,#1a1030 0%,var(--bg) 78%);}
  canvas{position:fixed;inset:0;width:100%;height:100%;}
  #glow{filter:blur(14px) saturate(1.5);opacity:0;pointer-events:none;}
</style>
</head>
<body>
<canvas id="glow"></canvas>
<canvas id="main"></canvas>
<script>
/* ============ CONFIGURAÇÃO (fácil de editar) ============ */
const GW=180, GH=245;        // grade de pixels (mais alto = mais detalhe)
const CYCLE=27;              // duração de cada ciclo (s): o buquê se forma, brilha e recomeça sozinho
const CFG={quant:12,lineH:.58};
/* ============ UTILIDADES ============ */
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const ease=v=>{v=clamp(v);return v*v*(3-2*v)};
const easeOut=v=>{v=clamp(v);return 1-Math.pow(1-v,3)};
const hsl=(c,dl=0,a=1,ds=0)=>`hsla(${c[0]},${clamp(c[1]+ds,0,100)}%,${clamp(c[2]+dl,0,100)}%,${a})`;
const rnd=(a,b)=>a+Math.random()*(b-a);
const easeBack=v=>{v=clamp(v);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(v-1,3)+c1*Math.pow(v-1,2)};   // "pop" com leve estouro
const WIND=t=>Math.sin(t*.55)*.9+Math.sin(t*1.3+1)*.5;            // vento
const GUST=t=>.35+.65*Math.pow(Math.max(0,Math.sin(t*.4)),2);     // rajadas periódicas
/* ============ CANVAS (linhas horizontais em pixel art) ============ */
const cv=document.getElementById('main'),ctx=cv.getContext('2d');
const gl=document.getElementById('glow'),gx=gl.getContext('2d');
const sc=document.createElement('canvas');sc.width=GW;sc.height=GH;
const sg=sc.getContext('2d',{willReadFrequently:true});
// buffer de saída: cada pixel da grade vira 2 linhas (cor + vão) -> efeito scanline sem desenhar 40 mil retângulos por quadro
const out=document.createElement('canvas');out.width=GW;out.height=GH*2;
const og=out.getContext('2d'),outImg=new ImageData(GW,GH*2),U32=new Uint32Array(outImg.data.buffer);
let W,H,cellPx,ox,oy,first,jit,noise,T0=performance.now(),PET=[];
function resize(){
  const dpr=Math.min(devicePixelRatio||1,3);W=innerWidth*dpr;H=innerHeight*dpr;cv.width=W;cv.height=H;
  cellPx=Math.max(2,Math.floor(Math.min(W*.97/GW,H*.9/GH)));
  ox=Math.floor((W-GW*cellPx)/2);oy=Math.floor((H-GH*cellPx)/2-H*.01);
  first=new Float32Array(GW*GH).fill(-1);
  jit=new Float32Array(GW*GH).map(()=>Math.random()*.8);
  noise=new Float32Array(GW*GH).map(()=>.8+Math.random()*.32);
  // brilho: canvas pequeno ampliado e desfocado pela GPU (CSS)
  gl.width=Math.round(GW/2);gl.height=Math.round(GH/2);
  gl.style.cssText=`inset:auto;left:${ox/dpr}px;top:${oy/dpr}px;width:${GW*cellPx/dpr}px;height:${GH*cellPx/dpr}px`;
}
function restart(){T0=performance.now();PET=[];first&&first.fill(-1);}
/* ============ DESENHO ============ */
const CREAM=[42,45,94];let SIL=0;
function paint(c,fill,st){
  if(SIL===1){c.fillStyle=c.strokeStyle='rgba(16,8,20,.85)';c.lineWidth=3.2;c.lineJoin='round';c.fill();c.stroke();}
  else if(SIL===2){c.fillStyle=c.strokeStyle=hsl(CREAM);c.lineWidth=3.2;c.lineJoin='round';c.fill();c.stroke();}
  else{c.fillStyle=fill;c.fill();if(st){c.strokeStyle=st[0];c.lineWidth=st[1];c.stroke();}}
}
const GD=[122,50,30],GLT=[118,55,46];
function strokeLeaf(c,P,w,s){
  if(s<=0)return;const n=22,pt=u=>{const m=1-u;return{
    x:m*m*m*P[0].x+3*m*m*u*P[1].x+3*m*u*u*P[2].x+u*u*u*P[3].x,
    y:m*m*m*P[0].y+3*m*m*u*P[1].y+3*m*u*u*P[2].y+u*u*u*P[3].y};};
  c.lineCap='round';
  for(const pass of[0,1])for(let i=0;i<n*s;i++){const u=i/n,a=pt(u),b=pt((i+1)/n),o=pass?-.7:0;
    c.strokeStyle=hsl(pass?GLT:GD);c.lineWidth=(w*Math.pow(Math.sin(Math.PI*Math.min(1,u)),.7)+.6)*(pass?.4:1);
    c.beginPath();c.moveTo(a.x,a.y+o);c.lineTo(b.x,b.y+o);c.stroke();}
}
function lily(c,f,x,y,r,b){
  const col=f.col,e=ease(b);c.save();c.translate(x,y);c.rotate(f.rot);
  const T=[];
  for(let j=0;j<6;j++){const a=-Math.PI/2+j*Math.PI/3,vx=Math.cos(a)*e,vy=-(1-e)+Math.sin(a)*f.sq*e;
    T.push({j,ang:Math.atan2(vy,vx||.0001)+(e<.05?(j-2.5)*.07:0),z:Math.sin(a)});}
  T.sort((p,q)=>p.z-q.z);
  for(const p of T){
    const L=r*(.78+.3*e),w=r*(.24+.16*e);c.save();c.rotate(p.ang);
    let g=null;if(!SIL){g=c.createLinearGradient(0,0,L,0);
      g.addColorStop(0,hsl(col,24,1,-18));g.addColorStop(.35,hsl(col,2));g.addColorStop(.62,hsl(col,-6));g.addColorStop(1,hsl([f.tip,col[1],col[2]],4,1,-4));}
    c.beginPath();c.moveTo(0,0);c.bezierCurveTo(L*.3,-w,L*.8,-w*.95,L,e*w*.5);c.bezierCurveTo(L*.8,w*.95,L*.3,w,0,0);paint(c,g);
    if(!SIL){c.strokeStyle=hsl(col,20,.55,-10);c.lineWidth=1;c.beginPath();c.moveTo(L*.1,0);c.lineTo(L*.9,e*w*.4);c.stroke();
      c.fillStyle=hsl(col,-26,.8);for(let k=0;k<3;k++)c.fillRect(L*(.22+k*.17),((p.j+k)%2?1:-1)*w*.28,1.2,1.2);}
    c.restore();}
  if(!SIL&&e>.2){const gr=c.createRadialGradient(0,0,0,0,0,r*.3);gr.addColorStop(0,'hsla(60,80%,88%,.95)');gr.addColorStop(1,'hsla(60,80%,88%,0)');
    c.fillStyle=gr;c.beginPath();c.arc(0,0,r*.3*ease(e*2),0,7);c.fill();}
  if(!SIL&&e>.35){const k=ease((e-.3)/.7),sl=r*.6*k;
    for(let i=0;i<6;i++){const a=-Math.PI/2+(i-2.5)*.45,ex=Math.cos(a)*sl*.9,ey=Math.sin(a)*sl*.8*f.sq-r*.04;
      c.strokeStyle=hsl([80,40,66]);c.lineWidth=.9;c.beginPath();c.moveTo(0,0);c.lineTo(ex,ey);c.stroke();
      c.fillStyle=hsl([20,80,38]);c.fillRect(ex-1,ey-1,2.2,2.4);}}
  c.restore();
}
function rose(c,x,y,r,b,col){
  const N=[8,7,6,5,3];
  for(let k=0;k<5;k++){if(SIL&&k>0)break;
    const lb=ease(b*1.4-k*.2),pr=r*(.6-k*.09)*(.6+.4*lb),dist=r*(.5-k*.085)*lb;
    for(let j=0;j<N[k];j++){
      const a=j/N[k]*6.283+k*.7+(1-lb)*.6,px=x+Math.cos(a)*dist,py=y+Math.sin(a)*dist*.88;
      let g=null;if(!SIL){g=c.createRadialGradient(px-Math.cos(a)*pr*.3,py-Math.sin(a)*pr*.3,0,px,py,pr);
        g.addColorStop(0,hsl(col,16));g.addColorStop(1,hsl(col,-8-k*5));}
      c.beginPath();c.ellipse(px,py,pr,pr*.82,a,0,7);paint(c,g,[hsl(col,-24,.55),.6]);}}
}
function daisy(c,x,y,r,b,col){
  const e=ease(b),n=12;c.save();c.translate(x,y);
  for(let j=0;j<n;j++){const a=j/n*6.283+.2,d=r*(.3+.3*e),rx=r*.42*(.4+.6*e),ry=r*.17;
    c.save();c.translate(Math.cos(a)*d,Math.sin(a)*d);c.rotate(a);
    let g=null;if(!SIL){g=c.createLinearGradient(-rx,0,rx,0);g.addColorStop(0,hsl(col,-10));g.addColorStop(1,hsl(col,14));}
    c.beginPath();c.ellipse(0,0,rx,ry,0,0,7);paint(c,g,[hsl(col,-26,.5),.5]);c.restore();}
  c.beginPath();c.arc(0,0,r*.3*(.5+.5*e),0,7);paint(c,hsl(DC),null);
  if(!SIL&&e>.3){c.fillStyle=hsl([38,75,52]);for(let k=0;k<7;k++){const a=k*2.4,d=r*.16*Math.sqrt(k/6);c.fillRect(Math.cos(a)*d-.5,Math.sin(a)*d-.5,1.1,1.1);}}
  c.restore();
}
function tulip(c,x,y,r,b,col,tilt){
  c.save();c.translate(x,y+r*.5);c.rotate(tilt);
  const h=r*1.7,spread=ease(b)*.6,w=r*.62*(.9+.4*ease(b));
  const petal=ang=>{c.save();c.rotate(ang);let g=null;
    if(!SIL){g=c.createLinearGradient(0,0,0,-h);g.addColorStop(0,hsl(col,-14));g.addColorStop(.6,hsl(col,2));g.addColorStop(1,hsl(col,18));}
    c.beginPath();c.moveTo(0,0);c.bezierCurveTo(-w,-h*.3,-w*.8,-h*.9,0,-h);c.bezierCurveTo(w*.8,-h*.9,w,-h*.3,0,0);
    paint(c,g,[hsl(col,-28,.5),.4]);c.restore();};
  petal(-spread);petal(spread);petal(0);c.restore();
}
function spray(c,x,y,r,b,col){
  if(SIL)return;const s=.4+.6*ease(b);
  for(let i=0;i<7;i++){const a=i*.9,d=r*(.25+(i%3)*.35)*s;
    c.fillStyle=hsl(col,i%2?0:-6);c.beginPath();c.arc(x+Math.cos(a)*d,y+Math.sin(a)*d,Math.max(1,r*.3*s),0,7);c.fill();}
}
function fern(c,x,y,ang,len,s,curl){
  if(s<=0)return;c.strokeStyle=hsl([125,50,34]);c.lineWidth=1.1;c.lineCap='round';
  let px=x,py=y,a=ang;const n=12;c.beginPath();
  for(let i=0;i<n*s;i++){const u=i/n;a+=curl/n;const nx=px+Math.cos(a)*len/n,ny=py+Math.sin(a)*len/n;
    c.moveTo(px,py);c.lineTo(nx,ny);const tl=len*.2*(1-u*.7);
    for(const k of[-1,1]){c.moveTo(nx,ny);c.lineTo(nx+Math.cos(a+k)*tl,ny+Math.sin(a+k)*tl);}px=nx;py=ny;}
  c.stroke();
}
function wavyTo(c,x1,y1,x2,y2,n,amp){
  const nx=-(y2-y1),ny=x2-x1,l=Math.hypot(nx,ny)||1;
  for(let i=1;i<=n;i++){const u=(i-.5)/n,o=(i%2?1:-1)*amp;
    c.quadraticCurveTo(x1+(x2-x1)*u+nx/l*o,y1+(y2-y1)*u+ny/l*o,x1+(x2-x1)*i/n,y1+(y2-y1)*i/n);}
}
// folha de papel: base externa/interna, topo externo/interno, duas cores, vincos
function sheet(c,b1,b2,t1,t2,ca,cb){
  const g=c.createLinearGradient(t1[0],t1[1],b2[0],b2[1]);g.addColorStop(0,hsl(ca));g.addColorStop(1,hsl(cb));
  c.fillStyle=g;c.beginPath();c.moveTo(b1[0],b1[1]);c.lineTo(t1[0],t1[1]);wavyTo(c,t1[0],t1[1],t2[0],t2[1],5,2.2);
  c.lineTo(b2[0],b2[1]);c.closePath();c.fill();
  c.lineCap='round';c.lineWidth=1;
  for(let k=1;k<4;k++){const u=k/4,bx=b1[0]+(b2[0]-b1[0])*u,by=b1[1]+(b2[1]-b1[1])*u,tx=t1[0]+(t2[0]-t1[0])*u,ty=t1[1]+(t2[1]-t1[1])*u;
    c.strokeStyle=k%2?hsl(ca,10,.45):hsl(cb,-14,.4);c.beginPath();c.moveTo(bx,by);c.lineTo(tx,ty);c.stroke();}
  c.strokeStyle=hsl(ca,14,.75);c.lineWidth=1.3;c.beginPath();c.moveTo(t1[0],t1[1]);wavyTo(c,t1[0],t1[1],t2[0],t2[1],5,2.2);c.stroke();
}
/* ---------- novas flores ---------- */
let DC=[28,65,32];
function sunflower(c,x,y,r,b,col){
  const e=ease(b);c.save();c.translate(x,y);
  for(let L=0;L<2;L++){const n=20+L*2;
    for(let j=0;j<n;j++){const a=j/n*6.283+L*.15,len=r*(.62-L*.1)*(.4+.6*e),w=r*.1;
      c.save();c.rotate(a);c.translate(r*.25,0);let g=null;
      if(!SIL){g=c.createLinearGradient(0,0,len,0);g.addColorStop(0,hsl([col[0]-6,col[1],col[2]-14-L*6]));g.addColorStop(1,hsl([col[0]+2,col[1],col[2]+10-L*6]));}
      c.beginPath();c.moveTo(0,0);c.bezierCurveTo(len*.3,-w,len*.8,-w*.8,len,0);c.bezierCurveTo(len*.8,w*.8,len*.3,w,0,0);paint(c,g,null);c.restore();}}
  const dr=r*.36*(.6+.4*e);c.beginPath();c.arc(0,0,dr,0,7);
  if(SIL)paint(c,null);else{const g=c.createRadialGradient(0,0,0,0,0,dr);g.addColorStop(0,hsl([22,65,16]));g.addColorStop(.7,hsl([27,60,26]));g.addColorStop(1,hsl([32,60,36]));
    c.fillStyle=g;c.fill();c.fillStyle=hsl([40,80,52],0,.8);
    for(let k=1;k<46;k++){const a=k*2.4,rr=Math.sqrt(k/46)*dr*.9;c.fillRect(Math.cos(a)*rr-.4,Math.sin(a)*rr-.4,.9,.9);}}
  c.restore();
}
function desert(c,x,y,r,b,col){
  const e=ease(b);c.save();c.translate(x,y);
  for(let j=0;j<5;j++){const a=-Math.PI/2+j*Math.PI*2/5+.3,d=r*.42*(.3+.7*e),rx=r*.5*(.5+.5*e),ry=r*.44*(.5+.5*e);
    c.save();c.rotate(a);c.translate(d,0);let g=null;
    if(!SIL){g=c.createLinearGradient(-rx,0,rx,0);g.addColorStop(0,hsl([col[0]+30,45,94]));g.addColorStop(.45,hsl(col,8));g.addColorStop(1,hsl([col[0]-18,col[1]+5,col[2]-14]));}
    c.beginPath();c.ellipse(0,0,rx,ry,0,0,7);paint(c,g,[hsl(col,-28,.55),.6]);c.restore();}
  if(!SIL&&e>.2){c.fillStyle=hsl([col[0]+40,35,96]);c.beginPath();c.arc(0,0,r*.13,0,7);c.fill();
    c.strokeStyle=hsl([col[0]-10,60,40],0,.6);c.lineWidth=.6;
    for(let j=0;j<5;j++){const a=-Math.PI/2+j*Math.PI*2/5+.3;c.beginPath();c.moveTo(0,0);c.lineTo(Math.cos(a)*r*.5*e,Math.sin(a)*r*.5*e);c.stroke();}}
  c.restore();
}
function orchid(c,x,y,r,b,col,rot){
  const e=ease(b),s=.45+.55*e;c.save();c.translate(x,y);c.rotate(rot||0);
  const el=(ex,ey,rx,ry,a,fl)=>{c.save();c.translate(ex,ey);c.rotate(a);c.beginPath();c.ellipse(0,0,rx,ry,0,0,7);let g=null;
    if(!SIL){g=c.createRadialGradient(0,0,0,0,0,Math.max(rx,ry));g.addColorStop(0,hsl(fl,-14));g.addColorStop(.6,hsl(fl,4));g.addColorStop(1,hsl(fl,12));}
    paint(c,g,[hsl(fl,-24,.5),.5]);c.restore();};
  el(0,-r*.5*s,r*.2*s,r*.42*s,0,col);el(-r*.38*s,r*.38*s,r*.2*s,r*.44*s,.8,col);el(r*.38*s,r*.38*s,r*.2*s,r*.44*s,-.8,col);
  el(-r*.5*s,-r*.05*s,r*.5*s,r*.4*s,.3,col);el(r*.5*s,-r*.05*s,r*.5*s,r*.4*s,-.3,col);
  el(0,r*.28*s,r*.15*s,r*.2*s,0,[col[0]+10,80,44]);
  if(!SIL&&e>.4){c.fillStyle=hsl([45,95,60]);c.fillRect(-1,r*.18*s,2,2);c.fillRect(-2.2,r*.3*s,1.2,1.2);c.fillRect(1.1,r*.3*s,1.2,1.2);
    c.strokeStyle=hsl([col[0]+10,70,38],0,.7);c.lineWidth=.6;
    for(const k of[-1,1]){c.beginPath();c.moveTo(k*r*.12,r*.08);c.lineTo(k*r*.45*s,-r*.04);c.stroke();}}
  c.restore();
}
function lav(c,x,y,r,b,col,rot){
  if(SIL)return;const e=ease(b);c.save();c.translate(x,y);c.rotate(rot||0);
  c.strokeStyle=hsl([120,40,36]);c.lineWidth=1;c.beginPath();c.moveTo(0,r*.3);c.lineTo(0,-r*(.2+.8*e));c.stroke();
  for(let i=0;i<10*e;i++){const yy=-i*r*.1,xx=Math.sin(i*2.1)*1.1,rr=1.9-i*.07;
    c.fillStyle=hsl(col,i%2?-6:6);c.beginPath();c.ellipse(xx-1.1,yy,rr*.8,rr,0,0,7);c.ellipse(xx+1.1,yy-.6,rr*.8,rr,0,0,7);c.fill();}
  c.restore();
}
function flor(c,f,x,y,R,b,i,t){
  const d=()=>{const T=f.type;
    if(T==='lily')lily(c,{...f,rot:f.rot+Math.sin(t*.7+i)*.02},x,y,R,b);else if(T==='rose')rose(c,x,y,R,b,f.col);
    else if(T==='daisy')daisy(c,x,y,R,b,f.col);else if(T==='tulip')tulip(c,x,y,R,b,f.col,f.rot+Math.sin(t*.8+i)*.03);
    else if(T==='sunflower')sunflower(c,x,y,R,b,f.col);else if(T==='desert')desert(c,x,y,R,b,f.col);
    else if(T==='orchid')orchid(c,x,y,R,b,f.col,f.rot);else if(T==='lav')lav(c,x,y,R,b,f.col,f.rot);else spray(c,x,y,R,b,f.col);};
  DC=f.cc||[28,65,32];SIL=1;c.save();c.translate(1.1,1.7);d();c.restore();SIL=0;d();
}

/* ---------- o buquê (predominância roxa) ---------- */
// tipo, x, y, tamanho, cor [matiz,sat,lum], matiz da ponta (lírio), inclinação
const BB={x:55,y:122};
const BQ=[
 ['lily',40,30,16,[278,65,58],300,-.2],['lily',72,52,14,[268,60,62],292,.4],['lily',20,52,13,[285,60,66],310,-.5],['lily',86,34,11,[300,55,70],320,.5],
 ['sunflower',60,24,14,[47,95,52]],['sunflower',28,76,10,[44,95,54]],
 ['orchid',54,62,15,[290,40,82],0,-.1],['orchid',84,62,12,[300,45,86],0,.2],['orchid',50,12,10,[285,38,84],0,.1],['orchid',12,76,10,[295,42,80],0,-.3],
 ['rose',44,56,10,[285,55,58]],['rose',68,72,10,[270,55,52]],['rose',34,68,9,[300,50,66]],['rose',80,80,9,[330,60,62]],['rose',54,82,9,[262,50,60]],['rose',64,38,8,[290,50,70]],
 ['desert',22,34,11,[322,70,62]],['desert',92,54,10,[316,65,66]],['desert',46,92,9,[326,70,60]],
 ['daisy',14,66,9,[0,0,96]],['daisy',98,44,9,[0,0,96]],['daisy',72,16,9,[0,0,96]],['daisy',36,16,8,[0,0,96]],
 ['tulip',10,44,10,[270,55,72],0,-.5],['tulip',84,18,10,[262,50,66],0,.4],
 ['lav',100,70,12,[262,55,62],0,.35],['lav',8,88,12,[268,55,64],0,-.4],['lav',64,10,12,[262,55,62],0,.1],
 ['spray',6,56,5,[300,35,92]],['spray',104,60,5,[270,40,86]],['spray',26,20,5,[300,35,92]],['spray',44,6,5,[270,40,86]],['spray',92,30,5,[300,35,92]],
 ['spray',78,6,5,[270,40,86]],['spray',16,92,5,[300,35,92]],['spray',96,86,5,[270,40,86]],['spray',60,58,5,[300,35,92]],['spray',30,48,5,[270,40,86]]
].map((a,i)=>({type:a[0],x:a[1],y:a[2],r:a[3],col:a[4],tip:a[5]||0,rot:a[6]||0,sq:.8,cc:a[0]==='daisy'?[46,95,58]:null,
  s:1.2+((i*17)%38)*.2,z:a[0]==='spray'?a[2]-40:a[0]==='lav'?a[2]-20:a[2]}));
const LEAVES=[[-2.7,44,.3,5,.2],[-2.35,50,.2,5,.3],[-2.0,48,-.2,5,.4],[-1.57,50,.2,4,.5],[-1.2,48,.25,5,.4],[-.8,50,-.2,5,.3],[-.45,44,-.3,5,.2]];
const FERNS=[[26,100,-2.6,34,.5,.6],[84,100,-.5,34,-.5,.8],[40,98,-1.9,30,.3,1.0],[72,98,-1.2,30,-.3,1.1],[18,80,-2.9,26,.6,1.2],[92,80,-.2,26,-.6,1.3]];
function stemPt(f,u,sw){
  const p1x=BB.x+(f.x+sw-BB.x)*.15,p1y=f.y+(BB.y-f.y)*.55,p2x=f.x+sw,m=1-u;
  return{x:m*m*BB.x+2*m*u*p1x+u*u*p2x,y:m*m*BB.y+2*m*u*p1y+u*u*f.y};}

/* ---------- embrulho em tons de lilás e creme ---------- */
function wrapBack(c,t){
  const wa=ease((t-3.2)/1.6);if(wa<=0)return;
  c.save();c.globalAlpha*=wa;c.translate(0,(1-wa)*8);
  sheet(c,[32,104],[54,92],[4,50],[22,30],[272,45,86],[268,45,58]);
  sheet(c,[78,104],[56,92],[106,48],[88,30],[38,45,90],[34,45,66]);
  sheet(c,[40,104],[56,94],[16,56],[30,40],[285,40,94],[275,45,76]);
  sheet(c,[74,104],[58,94],[98,58],[86,42],[262,55,64],[268,55,44]);
  c.restore();
}
function wrapFront(c,t){
  const wa=ease((t-4.2)/1.6);if(wa<=0)return;
  c.save();c.globalAlpha*=wa;c.translate(0,(1-wa)*10);c.lineCap='round';
  let g=c.createLinearGradient(16,0,94,0);g.addColorStop(0,hsl([275,55,88]));g.addColorStop(.45,hsl([272,50,70]));g.addColorStop(1,hsl([266,52,46]));
  c.fillStyle=g;c.beginPath();c.moveTo(16,96);wavyTo(c,16,96,94,96,12,2.6);c.lineTo(61,146);c.quadraticCurveTo(55,150,49,146);c.closePath();c.fill();
  for(let i=1;i<9;i++){const x=16+i*9.75;c.lineWidth=1.1;c.strokeStyle=i%2?hsl([280,60,94],0,.6):hsl([265,55,38],0,.5);
    c.beginPath();c.moveTo(x,98);c.lineTo(55+(x-55)*.1,146);c.stroke();}
  g=c.createLinearGradient(30,116,80,146);g.addColorStop(0,hsl([40,40,92]));g.addColorStop(1,hsl([34,36,70]));
  c.fillStyle=g;c.beginPath();c.moveTo(29,116);wavyTo(c,29,116,81,116,7,2);c.lineTo(61,146);c.quadraticCurveTo(55,150,49,146);c.closePath();c.fill();
  c.restore();
}
function laco(c,t){
  if(t<11.6)return;const k=easeBack((t-11.6)/1.3),w=Math.sin(t*2.4)*1.6;
  c.save();c.translate(55,112);c.scale(k,k);c.lineCap='round';c.lineJoin='round';
  const R1=hsl([282,62,60]),R2=hsl([280,55,34]),Rh=hsl([290,70,84]);
  c.strokeStyle=R2;c.lineWidth=5.5;c.beginPath();c.moveTo(-27,-3);c.quadraticCurveTo(0,6,27,-3);c.stroke();
  c.strokeStyle=R1;c.lineWidth=3.6;c.beginPath();c.moveTo(-27,-3.4);c.quadraticCurveTo(0,5.6,27,-3.4);c.stroke();
  for(const s of[-1,1])for(const[w,col]of[[3.4,R2],[2,R1]]){c.strokeStyle=col;c.lineWidth=w;c.beginPath();
    c.moveTo(0,2);c.bezierCurveTo(s*7+w,8,-s*3-w,13,s*5+w*.8,19);c.bezierCurveTo(s*9+w,22,s*2-w,26,s*7+w*1.2,32);c.stroke();}
  for(const s of[-1,1]){c.save();c.rotate(s*-.4);c.fillStyle=R1;c.beginPath();c.ellipse(s*9.5,0,10,5.6,0,0,7);c.fill();
    c.fillStyle=Rh;c.beginPath();c.ellipse(s*9.5,-1.6,6,1.8,0,0,7);c.fill();
    c.strokeStyle=R2;c.lineWidth=1;c.beginPath();c.ellipse(s*9.5,0,10,5.6,0,0,7);c.stroke();c.restore();}
  c.fillStyle=R1;c.beginPath();c.arc(0,1,3.4,0,7);c.fill();c.fillStyle=Rh;c.fillRect(-1.6,-.8,1.8,1.4);c.restore();
}

/* ---------- borboletas e partículas de luz ---------- */
const BF=[{ph:0,c:[205,75,66],c2:[270,60,70],sc:1.1,ax:44,ay:30,fx:.45,fy:.33},
          {ph:2.1,c:[48,95,60],c2:[30,90,55],sc:.95,ax:50,ay:26,fx:.38,fy:.5},
          {ph:4.2,c:[320,70,70],c2:[280,60,65],sc:1,ax:40,ay:34,fx:.52,fy:.41}];
function mariposa(c,b,t){
  const tt=t-9.5;if(tt<0)return;const al=ease(tt/1.5);
  const x=55+b.ax*Math.sin(t*b.fx+b.ph)+8*Math.sin(t*1.7+b.ph),y=52+b.ay*Math.sin(t*b.fy*1.3+b.ph*1.7)-6+5*Math.sin(t*2.3+b.ph);
  const dir=Math.cos(t*b.fx+b.ph)>=0?1:-1,fl=Math.abs(Math.cos(t*11+b.ph)),rx=3.2*(.25+.75*fl);
  c.save();c.globalAlpha*=al;c.translate(x,y);c.scale(b.sc*dir,b.sc);
  for(const s of[-1,1]){
    c.fillStyle=hsl(b.c);c.beginPath();c.ellipse(s*(1+rx*.85),-1.6,rx,3.2,s*.35,0,7);c.fill();
    c.fillStyle=hsl(b.c2);c.beginPath();c.ellipse(s*(.8+rx*.6),1.8,rx*.75,2.2,-s*.3,0,7);c.fill();
    c.fillStyle='rgb(255,246,255)';c.fillRect(s*(1+rx*.9)-.5,-3,1,1);}
  c.strokeStyle=hsl([270,40,18]);c.lineWidth=1;c.beginPath();c.moveTo(0,-2.6);c.lineTo(0,3.2);c.moveTo(0,-2.6);c.lineTo(-1.4,-4.6);c.moveTo(0,-2.6);c.lineTo(1.4,-4.6);c.stroke();
  c.restore();
}
const MO=Array.from({length:36},()=>({x:rnd(0,110),y:rnd(0,150),sp:rnd(2,6),ph:rnd(0,6),sz:rnd(.9,1.8)}));
function motes(c,t,dt){
  if(t<3)return;
  MO.forEach((m,i)=>{m.y-=m.sp*dt*.6;if(m.y<-3){m.y=152;m.x=rnd(0,110);}
    const v=Math.sin(t*2+m.ph);if(v<-.1)return;
    c.fillStyle=i%3?hsl([285,60,82]):hsl([48,90,76]);const z=m.sz*(.8+.4*v);c.fillRect(m.x+Math.sin(t*.8+m.ph)*4,m.y,z,z);});
}

/* ---------- cena ---------- */
const SP=Array.from({length:40},()=>({x:rnd(2,108),y:rnd(2,120),sp:rnd(1.5,3),ph:rnd(0,6)}));
function scene(c,t,dt){
  const fade=1-ease((t-(CYCLE-2))/1.8);
  c.save();c.globalAlpha=fade;
  wrapBack(c,t);
  FERNS.forEach(f=>fern(c,f[0],f[1],f[2],f[3],easeOut((t-f[5])/2.4),f[4]+Math.sin(t*.9+f[0])*.12*(1+GUST(t))));
  LEAVES.forEach(([a,len,cu,w,st])=>{const s=easeOut((t-st)/2.4),d=k=>({x:Math.cos(k),y:Math.sin(k)}),p1=d(a-cu),p2=d(a+cu+Math.sin(t*1.1+a)*.08*(1+GUST(t))),p3=d(a);
    strokeLeaf(c,[BB,{x:BB.x+p1.x*len*.45,y:BB.y+p1.y*len*.45},{x:BB.x+p2.x*len*.8,y:BB.y+p2.y*len*.8},{x:BB.x+p3.x*len,y:BB.y+p3.y*len}],w,s);});
  const info=BQ.map((f,i)=>{const g=easeOut((t-f.s)/1.8),b=ease((t-f.s-.9)/1.9),sw=(Math.sin(t*.8+i*1.3)*.6+WIND(t-f.x*.03)*GUST(t)*1.8)*g*(.4+(BB.y-f.y)/100*1.2);
    if(g>0){c.strokeStyle=hsl([125,50,30]);c.lineWidth=1.5;c.lineCap='round';c.beginPath();
      for(let k=0;k<=22;k++){const p=stemPt(f,g*k/22,sw);k?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y);}c.stroke();}
    return{f,g,b,tip:stemPt(f,g,sw),i};});
  wrapFront(c,t);
  info.sort((a,b)=>a.f.z-b.f.z).forEach(({f,g,b,tip,i})=>{if(g<.03)return;
    flor(c,f,tip.x,tip.y,f.r*(.35+.65*easeBack((g-.4)/.6))*(1+(b>.9?.04*Math.sin(t*1.7+i*1.3):0)),b,i,t);
    if(b>.5&&f.type!=='spray'&&f.type!=='lav'&&PET.length<48&&Math.random()<.7*dt)
      PET.push({x:tip.x+rnd(-4,4),y:tip.y+2,vx:rnd(-3,3),vy:rnd(6,10),rot:rnd(0,6),sp:rnd(-2,2),c:f.type==='sunflower'?[45,95,58]:f.col,ph:rnd(0,6)});
    if(b>.8&&Math.sin(t*2.7+i*1.9)>.94){const sx=Math.floor(tip.x+((i*7)%9)-4),sy=Math.floor(tip.y+((i*5)%9)-5);
      c.fillStyle='rgb(255,244,255)';c.fillRect(sx,sy,1.3,1.3);c.fillRect(sx-1.5,sy,4.3,1.3);c.fillRect(sx,sy-1.5,1.3,4.3);}});
  laco(c,t);BF.forEach(b=>mariposa(c,b,t));
  PET=PET.filter(p=>p.y<154);
  for(const p of PET){p.x+=(p.vx+Math.sin(t*2+p.ph)*4+WIND(t)*GUST(t)*7)*dt;p.y+=p.vy*dt;p.rot+=p.sp*dt;
    c.fillStyle=hsl(p.c,6);c.beginPath();c.ellipse(p.x,p.y,2.4,1.3,p.rot,0,7);c.fill();}
  motes(c,t,dt);
  if(t>4)for(const k of SP){const v=Math.sin(t*k.sp+k.ph);if(v>.86){const x=Math.floor(k.x),y=Math.floor(k.y);
    c.fillStyle='rgb(240,230,255)';c.fillRect(x,y,1.3,1.3);if(v>.96){c.fillRect(x-1.5,y,4.3,1.3);c.fillRect(x,y-1.5,1.3,4.3);}}}
  c.restore();
}

/* ============ LOOP ============ */
let last=0;
const Q=CFG.quant,qv=(v,fl,n)=>{v=(v+(255-v)*fl)*n;if(v>255)v=255;return Math.round(v/Q)*Q;};
function frame(nowMs){
  let t=(performance.now()-T0)/1000;if(t>CYCLE){restart();t=0;}
  const dt=Math.min(.05,(nowMs-last)/1000||.016);last=nowMs;
  sg.setTransform(1,0,0,1,0,0);sg.clearRect(0,0,GW,GH);sg.setTransform(GW/110,0,0,GH/150,0,0);scene(sg,t,dt);
  const d=sg.getImageData(0,0,GW,GH).data;
  U32.fill(0);const ph=((t*.11)%1.7)-.35;
  for(let j=0;j<GH;j++){const row=j*2*GW;
    for(let i=0;i<GW;i++){const idx=j*GW+i,p=idx*4;if(d[p+3]<110)continue;
      let f=first[idx];if(f<0)f=first[idx]=t;
      const rev=(t-f-jit[idx])/.45;if(rev<=0)continue;
      const sh=t>7?Math.max(0,1-Math.abs(i/GW*.8+j/GH*.6-ph)*8):0,r1=rev>1?1:rev,fl0=r1<.6?(1-r1/.6)*.6:0,fl=sh>0?Math.max(fl0,sh*.38):fl0,n=noise[idx]*(1+.05*Math.sin(t*3+idx));
      U32[row+i]=((r1*255)<<24)|(qv(d[p+2],fl,n)<<16)|(qv(d[p+1],fl,n)<<8)|qv(d[p],fl,n);}}
  og.putImageData(outImg,0,0);
  ctx.clearRect(0,0,W,H);ctx.imageSmoothingEnabled=false;
  ctx.drawImage(out,0,0,GW,GH*2,ox,oy,GW*cellPx,GH*cellPx);
  gx.clearRect(0,0,gl.width,gl.height);gx.drawImage(sc,0,0,gl.width,gl.height);
  gl.style.opacity=(.55+.08*Math.sin(t*1.3))*clamp(t/5)*(1-ease((t-(CYCLE-2))/1.8));
  requestAnimationFrame(frame);
}
addEventListener('resize',resize);
addEventListener('pointerdown',restart);   // tocar na tela reinicia a animação
resize();requestAnimationFrame(frame);
</script>
